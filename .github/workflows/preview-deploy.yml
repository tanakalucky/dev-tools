# PR ごとの Worker Preview の作成・更新。削除は preview-cleanup が行う。
# 信頼モデル: 本人が管理する PR 専用。build と deploy が同じ job のため、PR の build コードは
# deploy step の secret に影響しうる(受け入れ済み。secret の隔離は主張しない)。
# pull_request の workflow は PR 側の定義で動くため、下の条件も PR 側で書き換えられる。
name: preview-deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # owner 本人が起動・再実行した、同一リポジトリの PR だけ動く。PR 作者名や commit author は見ない。
    if: >-
      vars.PREVIEW_DEPLOY_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.actor_id == github.repository_owner_id
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # PR 由来の値は env 経由で渡し、run に直接埋め込まない。
      PREVIEW_NAME: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: アプリの有無と Preview 名の確認
        id: guard
        run: |
          if [ ! -f package.json ]; then
            echo "ルートに package.json が無いため、何もしません" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 削除(preview-cleanup)と同じ名前検査。失敗したら job を失敗させる。
          bash .github/preview/check-preview-name.sh "$PREVIEW_NAME"
          echo "action=deploy" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.action == 'deploy'
        with:
          node-version: 24

      - name: 依存関係のインストール
        if: steps.guard.outputs.action == 'deploy'
        run: npm ci

      - name: Preview 用の build
        if: steps.guard.outputs.action == 'deploy'
        env:
          CLOUDFLARE_PREVIEW_BUILD: "true"
        run: npm run build

      - name: deploy 直前の確認
        id: current
        if: steps.guard.outputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.state + " " + .head.sha')
          if [ "$current" = "open $HEAD_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR が閉じたか head が進んだため deploy しません" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview の deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # アプリが固定している cf を使う。Preview 名は位置引数。
        run: npx --no-install cf previews deploy "$PREVIEW_NAME" --prebuilt
