# preview の deploy。preview-build の完了で起動し、PR のコードは checkout も実行もしない。
# 検査と判定は main 側の helper で行い、secret は deploy step と削除 step の env にだけ渡す。
name: preview-deploy

on:
  workflow_run:
    workflows: [preview-build]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: preview-pr-${{ github.event.workflow_run.pull_requests[0].number || 'none' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.PREVIEW_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      PREVIEW_ENABLED: ${{ vars.PREVIEW_DEPLOY_ENABLED }}
      PREVIEW_OWNER: ${{ github.repository_owner }}
      PREVIEW_HELPER: ${{ github.workspace }}/.github/preview
      ARTIFACT_ROOT: ${{ runner.temp }}/preview-artifact
    steps:
      # 既定 ref(main)だけを取得する。PR のコードは取得しない。
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 判定(API で取り直す)
        id: decide
        run: node "$PREVIEW_HELPER/bin/preview.mjs" decide-deploy

      - name: skip の理由
        if: steps.decide.outputs.action == 'skip'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: echo "skip - $REASON"

      - name: helper の依存関係をインストール
        if: steps.decide.outputs.action != 'skip'
        working-directory: .github/preview
        run: npm ci --ignore-scripts

      - name: 名前の検査
        if: steps.decide.outputs.action != 'skip'
        env:
          WORKER_NAME: ${{ steps.decide.outputs.name }}
        run: node "$PREVIEW_HELPER/bin/preview.mjs" assert-name

      - name: 成果物のダウンロード(作業ツリーの外)
        if: steps.decide.outputs.action == 'deploy'
        uses: actions/download-artifact@v4
        with:
          name: preview-output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preview-artifact/.cloudflare/output

      - name: 成果物の検査と設定の書き換え
        if: steps.decide.outputs.action == 'deploy'
        env:
          WORKER_NAME: ${{ steps.decide.outputs.name }}
        run: node "$PREVIEW_HELPER/bin/preview.mjs" prepare-artifact "$ARTIFACT_ROOT" "$WORKER_NAME"

      - name: deploy 直前の再判定
        id: redecide
        if: steps.decide.outputs.action == 'deploy'
        run: node "$PREVIEW_HELPER/bin/preview.mjs" decide-deploy

      - name: deploy
        if: steps.decide.outputs.action == 'deploy' && steps.redecide.outputs.action == 'deploy'
        working-directory: ${{ runner.temp }}/preview-artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SEND_TELEMETRY: "false"
          DO_NOT_TRACK: "1"
        run: node "$PREVIEW_HELPER/node_modules/cf/bin/cf" deploy --prebuilt --provision=false

      - name: deploy 直後の再判定
        id: post
        if: steps.decide.outputs.action == 'deploy' && steps.redecide.outputs.action == 'deploy'
        run: node "$PREVIEW_HELPER/bin/preview.mjs" decide-deploy

      - name: 削除(PR が閉じられている場合)
        id: remove
        if: >-
          steps.decide.outputs.action == 'delete' ||
          steps.redecide.outputs.action == 'delete' ||
          steps.post.outputs.action == 'delete'
        working-directory: ${{ runner.temp }}
        env:
          WORKER_NAME: ${{ steps.decide.outputs.name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SEND_TELEMETRY: "false"
          DO_NOT_TRACK: "1"
        run: node "$PREVIEW_HELPER/node_modules/cf/bin/cf" workers delete "$WORKER_NAME" --force

      - name: job summary
        if: steps.decide.outputs.action != 'skip'
        env:
          WORKER_NAME: ${{ steps.decide.outputs.name }}
          HEAD_SHA: ${{ steps.decide.outputs.head_sha }}
          ACTION: ${{ steps.decide.outputs.action }}
        run: |
          {
            echo "### preview"
            echo "- 判定: $ACTION"
            echo "- Worker 名: $WORKER_NAME"
            echo "- 対象 SHA: $HEAD_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
