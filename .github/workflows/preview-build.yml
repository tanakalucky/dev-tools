# preview のビルド。PR のコードを実行するが、secret は一切参照せず、権限は contents: read のみ。
# deploy は別 workflow(preview-deploy)が、この run の成果物を検査したうえで行う。
name: preview-build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: package.json の有無を確認
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "package.json がないため成果物を作らず成功終了します"
            echo "has_package=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_package == 'true'
        with:
          node-version: 24

      - name: 依存関係のインストール
        if: steps.detect.outputs.has_package == 'true'
        run: npm ci

      - name: ビルド
        if: steps.detect.outputs.has_package == 'true'
        run: npm run build

      - name: 成果物のアップロード
        if: steps.detect.outputs.has_package == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-output
          path: .cloudflare/output
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
